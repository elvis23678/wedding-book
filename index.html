<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Wedding Tattoo Experience — catalogo digitale premium">
  <title>Wedding Tattoo Experience</title>
  <style>
    :root{--gold:#c99a36;--gold2:#f0cf75;--text:#f7f3ea;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}html,body{height:100%;margin:0;background:#020202;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow:hidden}button{font:inherit}
    body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 38%,#171208 0,#080706 38%,#010101 76%);pointer-events:none}
    .app{position:relative;width:100%;height:100dvh;isolation:isolate}
    .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(52px + var(--safe-top)) 8px calc(66px + var(--safe-bottom));touch-action:pan-y;user-select:none;overflow:hidden}
    .page-shell{position:relative;display:inline-flex;align-items:center;justify-content:center;width:auto;height:auto;max-width:100%;max-height:100%;filter:drop-shadow(0 22px 48px rgba(0,0,0,.78))}
    #pageImage{display:block;width:auto;height:auto;max-width:calc(100vw - 16px);max-height:calc(100dvh - 118px - var(--safe-top) - var(--safe-bottom));object-fit:contain;background:#050505;transition:opacity .32s ease,transform .34s cubic-bezier(.22,.61,.36,1),filter .28s ease;-webkit-user-drag:none;border:0}
    #pageImage.loading{filter:blur(8px);opacity:.35;transform:scale(.988)}
    #pageImage.leaving-left{opacity:0;transform:translateX(-22px) scale(.994)}#pageImage.leaving-right{opacity:0;transform:translateX(22px) scale(.994)}#pageImage.enter{opacity:0;transform:translateY(8px) scale(.994)}
    .topbar,.bottombar{position:absolute;left:0;right:0;z-index:10;display:flex;align-items:center;gap:8px;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));pointer-events:none}
    .topbar{top:0;padding-top:calc(7px + var(--safe-top));justify-content:space-between}.bottombar{bottom:0;padding-bottom:calc(9px + var(--safe-bottom));justify-content:center}
    .brand{pointer-events:auto;display:flex;align-items:center;gap:8px;color:var(--gold2);letter-spacing:.12em;text-transform:uppercase;font-size:11px;text-shadow:0 1px 18px #000}
    .brand-mark{width:22px;height:22px;border:1px solid rgba(201,154,54,.75);transform:rotate(45deg);display:grid;place-items:center}.brand-mark span{transform:rotate(-45deg);font-family:Georgia,serif;font-size:11px}
    .controls{display:flex;gap:7px;pointer-events:auto}.btn{width:36px;height:36px;border-radius:999px;border:1px solid rgba(201,154,54,.34);background:rgba(5,5,5,.52);backdrop-filter:blur(16px);color:var(--gold2);display:grid;place-items:center;cursor:pointer;transition:.2s ease;box-shadow:0 8px 24px rgba(0,0,0,.18)}.btn:hover{border-color:rgba(240,207,117,.85);background:rgba(20,16,8,.68)}.btn:active{transform:scale(.94)}.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7}
    .counter{pointer-events:auto;min-width:118px;height:36px;padding:0 15px;border-radius:999px;border:1px solid rgba(201,154,54,.32);background:rgba(5,5,5,.56);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;color:#eee8dc;font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:.07em;box-shadow:0 8px 24px rgba(0,0,0,.18)}
    .nav-edge{position:absolute;top:50%;z-index:8;transform:translateY(-50%);width:52px;height:80px;border:0;background:transparent;color:rgba(240,207,117,.7);cursor:pointer;display:grid;place-items:center}.nav-edge svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.25}.nav-edge.prev{left:6px}.nav-edge.next{right:6px}.nav-edge:hover{color:#fff1bd}.nav-edge:disabled{opacity:.16;cursor:default}
    .drawer{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.68);backdrop-filter:blur(20px);opacity:0;visibility:hidden;transition:.26s ease;display:flex;justify-content:flex-end}.drawer.open{opacity:1;visibility:visible}.drawer-panel{width:min(520px,100%);height:100%;background:linear-gradient(180deg,rgba(13,13,13,.985),rgba(3,3,3,.985));border-left:1px solid rgba(201,154,54,.2);padding:calc(16px + var(--safe-top)) 14px calc(16px + var(--safe-bottom));transform:translateX(26px);transition:.26s ease;display:flex;flex-direction:column}.drawer.open .drawer-panel{transform:none}.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.drawer-title{font-family:Georgia,serif;color:var(--gold2);font-size:23px;letter-spacing:.05em}.grid{overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:2px 2px 24px;scrollbar-color:#7c6023 transparent}.thumb{position:relative;border:1px solid rgba(201,154,54,.16);border-radius:8px;background:#0a0a0a;padding:0;cursor:pointer;overflow:hidden;aspect-ratio:1/1.414;box-shadow:0 10px 24px rgba(0,0,0,.25)}.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:.22s}.thumb:hover img{transform:scale(1.02)}.thumb.active{border-color:var(--gold2);box-shadow:0 0 0 1px var(--gold2),0 14px 34px rgba(0,0,0,.68)}.thumb span{position:absolute;right:6px;bottom:6px;min-width:25px;height:25px;padding:0 6px;border-radius:99px;background:rgba(0,0,0,.8);border:1px solid rgba(240,207,117,.45);display:grid;place-items:center;color:#fff3c6;font-size:10px}
    .splash{position:absolute;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(circle at center,#171006 0,#050505 48%,#000 100%);transition:opacity .55s ease,visibility .55s}.splash.hidden{opacity:0;visibility:hidden}.splash-card{text-align:center;padding:30px;max-width:560px}.splash-logo{width:104px;height:104px;margin:0 auto 25px;border:1px solid var(--gold);transform:rotate(45deg);display:grid;place-items:center;box-shadow:0 0 78px rgba(201,154,54,.11)}.splash-logo div{transform:rotate(-45deg);font-family:Georgia,serif;color:var(--gold2);font-size:30px}.splash h1{font-family:Georgia,serif;font-weight:400;color:var(--gold2);font-size:clamp(29px,6vw,56px);margin:0 0 10px;letter-spacing:.045em}.splash p{color:#d5cbb8;letter-spacing:.17em;text-transform:uppercase;font-size:11px;margin:0 0 31px}.enter-btn{border:1px solid var(--gold);color:var(--gold2);background:rgba(0,0,0,.12);padding:12px 27px;letter-spacing:.17em;text-transform:uppercase;cursor:pointer;transition:.2s}.enter-btn:hover{background:var(--gold);color:#111}
    .toast{position:absolute;left:50%;bottom:calc(70px + var(--safe-bottom));z-index:20;transform:translate(-50%,12px);opacity:0;padding:8px 13px;border-radius:999px;background:rgba(8,8,8,.88);border:1px solid rgba(201,154,54,.28);font-size:11px;color:#e9dfcb;transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:700px){.stage{padding-left:4px;padding-right:4px}.brand span:last-child{display:none}.nav-edge{display:none}.grid{grid-template-columns:repeat(3,1fr)}#pageImage{max-width:calc(100vw - 8px);max-height:calc(100dvh - 108px - var(--safe-top) - var(--safe-bottom))}.btn{width:35px;height:35px}.counter{height:35px;min-width:114px}.topbar{padding-top:calc(6px + var(--safe-top))}.bottombar{padding-bottom:calc(7px + var(--safe-bottom))}}
    @media(min-width:1200px){#pageImage{max-height:calc(100dvh - 130px);max-width:calc(100vw - 180px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="app" id="app">
  <div class="stage" id="stage" aria-live="polite">
    <div class="page-shell"><img id="pageImage" src="page-01.png" alt="Pagina 1 del Wedding Book" draggable="false"></div>
  </div>
  <button class="nav-edge prev" id="prevEdge" aria-label="Pagina precedente"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
  <button class="nav-edge next" id="nextEdge" aria-label="Pagina successiva"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  <header class="topbar">
    <div class="brand"><div class="brand-mark"><span>W</span></div><span>Wedding Tattoo Experience</span></div>
    <div class="controls">
      <button class="btn" id="homeBtn" aria-label="Vai alla copertina"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/></svg></button>
      <button class="btn" id="menuBtn" aria-label="Apri indice"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="btn" id="fullBtn" aria-label="Schermo intero"><svg viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/></svg></button>
    </div>
  </header>
  <footer class="bottombar">
    <button class="btn" id="prevBtn" aria-label="Pagina precedente"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="counter"><span id="counter">Pagina 1 / 20</span></div>
    <button class="btn" id="nextBtn" aria-label="Pagina successiva"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  </footer>
  <div class="drawer" id="drawer" aria-hidden="true"><div class="drawer-panel" role="dialog" aria-modal="true" aria-label="Indice delle pagine"><div class="drawer-head"><div class="drawer-title">Indice</div><button class="btn" id="closeDrawer" aria-label="Chiudi indice"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div class="grid" id="thumbGrid"></div></div></div>
  <div class="splash" id="splash"><div class="splash-card"><div class="splash-logo"><div>W</div></div><h1>Wedding Tattoo Experience</h1><p>Love. Marked. Forever.</p><button class="enter-btn" id="enterBtn">Entra nel Wedding Book</button></div></div>
  <div class="toast" id="toast"></div>
</div>
<script>
(()=>{'use strict';
const TOTAL=20, img=document.getElementById('pageImage'), counter=document.getElementById('counter'), drawer=document.getElementById('drawer'), grid=document.getElementById('thumbGrid'), toast=document.getElementById('toast');
let current=1,busy=false,startX=0,startY=0,deltaX=0;
const path=n=>`page-${String(n).padStart(2,'0')}.png`, thumbPath=n=>`page-${String(n).padStart(2,'0')}.png`;
function preload(n){if(n<1||n>TOTAL)return;const p=new Image();p.src=path(n)}
function updateUI(){counter.textContent=`Pagina ${current} / ${TOTAL}`;document.getElementById('prevBtn').disabled=current===1;document.getElementById('prevEdge').disabled=current===1;document.getElementById('nextBtn').disabled=current===TOTAL;document.getElementById('nextEdge').disabled=current===TOTAL;grid.querySelectorAll('.thumb').forEach((el,i)=>el.classList.toggle('active',i+1===current));preload(current-1);preload(current+1)}
function go(n,dir=0){n=Math.max(1,Math.min(TOTAL,n));if(n===current||busy)return;busy=true;img.classList.add(dir>0?'leaving-left':'leaving-right');setTimeout(()=>{current=n;img.className='loading';img.onload=()=>{img.className='enter';requestAnimationFrame(()=>requestAnimationFrame(()=>{img.className='';busy=false;updateUI()}))};img.onerror=()=>{busy=false;showToast('Immagine non disponibile')};img.src=path(current);img.alt=`Pagina ${current} del Wedding Book`;},180)}
function showToast(t){toast.textContent=t;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('show'),1700)}
function openDrawer(){drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');setTimeout(()=>grid.querySelector('.thumb.active')?.scrollIntoView({block:'center'}),80)}function closeDrawer(){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true')}
for(let i=1;i<=TOTAL;i++){const b=document.createElement('button');b.className='thumb'+(i===1?' active':'');b.setAttribute('aria-label',`Apri pagina ${i}`);b.innerHTML=`<img src="${thumbPath(i)}" alt="Anteprima pagina ${i}" loading="lazy"><span>${i}</span>`;b.onclick=()=>{const d=i>current?1:-1;closeDrawer();setTimeout(()=>go(i,d),120)};grid.appendChild(b)}
['prevBtn','prevEdge'].forEach(id=>document.getElementById(id).onclick=()=>go(current-1,-1));['nextBtn','nextEdge'].forEach(id=>document.getElementById(id).onclick=()=>go(current+1,1));document.getElementById('homeBtn').onclick=()=>go(1,-1);document.getElementById('menuBtn').onclick=openDrawer;document.getElementById('closeDrawer').onclick=closeDrawer;drawer.onclick=e=>{if(e.target===drawer)closeDrawer()};
document.getElementById('enterBtn').onclick=()=>{document.getElementById('splash').classList.add('hidden');preload(2)};
document.getElementById('fullBtn').onclick=async()=>{try{if(!document.fullscreenElement){await document.documentElement.requestFullscreen();showToast('Schermo intero attivo')}else await document.exitFullscreen()}catch{showToast('Schermo intero non disponibile')}};
document.addEventListener('keydown',e=>{if(drawer.classList.contains('open')){if(e.key==='Escape')closeDrawer();return}if(e.key==='ArrowRight'||e.key==='PageDown')go(current+1,1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(current-1,-1);if(e.key==='Home')go(1,-1);if(e.key==='End')go(TOTAL,1);if(e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen()});
const stage=document.getElementById('stage');stage.addEventListener('touchstart',e=>{const t=e.changedTouches[0];startX=t.clientX;startY=t.clientY;deltaX=0},{passive:true});stage.addEventListener('touchmove',e=>{deltaX=e.changedTouches[0].clientX-startX},{passive:true});stage.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-startX,dy=t.clientY-startY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.2)go(current+(dx<0?1:-1),dx<0?1:-1)},{passive:true});
updateUI();})();
</script>
</body>
</html>
